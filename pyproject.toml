[project]
name = "jabarti"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yazeedmshayekh02", email = "mshayekhy17@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "datasets>=3.1.0",
    "fastparquet>=2026.9.0",
    "huggingface-hub>=2.3.0",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "pandas>=2.0.3",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "tiktoken>=0.14.0",
    "tokenizers>=0.23.3",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "trackio>=0.43.0",
    "transformers>=5.20.2",
]

[project.scripts]
jabarti = "jabarti:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
